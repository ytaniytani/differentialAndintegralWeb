name: Publish to GitHub Pages

# mainの内容をgh-pagesブランチへミラーする。
# GitHub Pages(Settings → Pages)はgh-pagesブランチ/ルートを配信する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages --force
